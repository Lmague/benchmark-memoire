# ViT-B/16 DINOv3 (lvd1689m) — LoRA r=8 pur (data-efficiency curve)
#
# LoRA Q,V sur TOUS les blocs, full_ft_block_indices: [] (pas de full-FT).
# r=8, alpha=8.0 (scaling=1.0), dropout=0.0.
# Mêmes hyper-paramètres que le LoRA r=8 qui a donné F1=0.4835±0.0011 à 100%.
#
# NB : le CSV source est le schéma BRUT 12cls (defaut base.yaml : splits/)
# _apply_11cls_remap filtre RHOL et décale les indices.

model:
  name: dinov3_vitb16_lvd
  num_classes: 11
  norm: imagenet

regime: lora

lora:
  r: 8
  alpha: 8.0
  target_modules: [q, v]
  full_ft_block_indices: []
  dropout: 0.0

optim:
  weight_decay: 0.05
  lr:
    lora: 1.0e-4
    full_late: 5.0e-5
    norm: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 0
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
