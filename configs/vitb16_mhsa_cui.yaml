# ViT-B/16 ImageNet — MHSA-only (attention + head dégelés, FFN gelé ; Touvron 2022).
# Régime screening 2/4. Recette T1 : warmup 3 ep · bf16 · grad_clip 1.0 · early-stop
# f1_macro_pres. Pas de LP-FT (head_only=0) : MHSA est déjà un fine-tuning partiel.
# 11 classes (RHOL exclu). LR SoTA : attn=1e-5, head=1e-4 (≠ notebook 4e-5/2e-4).
# NB : warmup_epochs sous `schedule:` (lu par engine.build_scheduler).
#
# NB CRITIQUE : ce config est lancé via scripts/datacurve_one_run.py (pas train.py
# directement), qui fait SON PROPRE filtrage RHOL + remap 12->11 en interne (voir
# _RHOL_IDX/LABEL_REMAP_12TO11 en tête de ce script). csv_dir doit donc pointer vers
# les CSV BRUTS 12 classes (splits/, le défaut de base.yaml) — PAS vers splits_11cls/
# (déjà remappé), sinon double-remap silencieux : une classe (WILL) disparaît, une
# autre (RUBC) affiche un compte erroné. Bug diagnostiqué le 2026-07-15/16, cf. fil de
# debug — ne jamais réintroduire de csv_dir custom sur ce fichier sans revérifier
# quel script de training consomme réellement ce config.

model:
  name: vitb16
  num_classes: 11
  norm: imagenet

regime: mhsa

optim:
  weight_decay: 0.05
  lr:
    attn: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  weighting: effective_num
  cui_beta: 0.999
  epochs: 50
  patience: 10
  head_only_epochs: 0
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
