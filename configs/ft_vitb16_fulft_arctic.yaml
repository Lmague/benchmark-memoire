# Extraction backbone — ViT-B/16 FINE-TUNÉ Arctic-TVC (régime FULL fine-tuning).
#   python extract.py --config configs/ft_vitb16_fulft_arctic.yaml --dry-run
#   python extract.py --config configs/ft_vitb16_fulft_arctic.yaml --force-reextract
#
# Backbone timm vit_base_patch16_224 num_classes=0 (tête retirée) → CLS pooled, dim 768.
# Régime d'origine : full (tout le backbone + head dégelés).
#
# ⚠ CHECKPOINT : Drive `checkpoints_v3/vitb16_fulft_best.pth` (split v3). Copier dans
#   `checkpoints/` local, comme pour SatMAE.
# ⚠ Provenance des .npy existants douteuse → forcer --force-reextract à la 1re extraction.
regime: none          # ignoré pour l'extraction (aucun entraînement, aucun optimizer)

checkpoint: "vitb16_fulft_best.pth"   # depuis Drive checkpoints_v3/ (ViT-B full ft v3)

model:
  name: vitb16_fulft_arctic
  num_classes: 12
  norm: imagenet
features:
  cache: true
  remap_v3: false
  layerwise: false
