# ViT-B/16 ImageNet — FULL fine-tuning AMÉLIORÉ (recette T1), baseline SoTA Arctic-TVC.
# Régime screening 1/4. Nom canonique aligné sur les 3 autres régimes SoTA
# (vitb16_mhsa_sota / _explora_sota / _scratch_sota).
#
# ⚠ PROVENANCE : le screening du 23 juin (job 63836082, array 0 → full) a utilisé
#   configs/vitb16_fulft_sota.yaml (cf. scripts/slurm_sota_screening.sh l.30 et log
#   sota_63836082_0.out l.2). Ce fichier en est une COPIE À L'IDENTIQUE (même regime,
#   num_classes, LR, schedule, LP-FT, C_grid) sous le nom canonique vitb16_full_sota.yaml,
#   pour la complétion data curve. Les deux configs sont interchangeables ; ne pas les
#   laisser diverger. Schéma tracé : 11 classes (metrics.json → "schema":"11cls_no_rhol").
#
#   warmup 3 ep · bf16 (sans GradScaler) · grad_clip 1.0 · early-stop f1_macro_pres
#   · LP-FT (head_only 2 ep). 11 classes (RHOL exclu), labels 0-10.
# NB : warmup_epochs vit sous `schedule:` (lu par engine.build_scheduler), pas `train:`.
model:
  name: vitb16
  num_classes: 11
  norm: imagenet

regime: full

optim:
  weight_decay: 0.05
  lr:
    backbone: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 2
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
