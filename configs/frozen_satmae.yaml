# Extraction frozen — SatMAE ViT-L/16 (fMoW-RGB, MAE satellite). CLS, dim 1024.
#   python extract.py --config configs/frozen_satmae.yaml
#
# ⚠ Checkpoint : utiliser le pré-entraînement fMoW-**RGB** (3 canaux) de SatMAE,
#   PAS fMoW-Sentinel (multispectral, 13 canaux — incompatible avec 3 canaux UAV).
#   Source : README SatMAE (github.com/sustainlab-group/SatMAE). Chargé dans un ViT-L/16
#   timm par remap strict=False (évite le timm==0.3.2 épinglé par le repo).
# ⚠ Normalisation : `imagenet` par défaut (recette d'éval amont) — à vérifier contre le
#   transform du repo si les scores semblent anormaux.
regime: none          # ignoré pour l'extraction/probe (aucun entraînement, aucun optimizer)

# Chemin du checkpoint .pth SatMAE fMoW-RGB ViT-L/16.
checkpoint: "/home/erazal/Documents/Mémoire/checkpoints/satmae_vitl16_fmow_rgb.pth"

model:
  name: satmae_vitl16
  num_classes: 12
  norm: imagenet
features:
  cache: true
  remap_v3: false
  layerwise: false
