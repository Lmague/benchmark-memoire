# DINOv3 ViT-B/16 (LVD-1689M) — LoRA Q/V r=8 sur TOUTES les couches.
# Inspiré de MIDOG 2025 (arXiv:2508.21041) : DINOv3-H+ LoRA r=8 Q/V,
# 1ère place au challenge MIDOG 2025 Task 2.
# Ici : ViT-B (plus petit), mêmes hyperparams LoRA, sans full FT extrémités.
# Objectif : benchmark — est-ce que LoRA simple suffit vs ExPLoRA extrêmes-only ?

model:
  name: dinov3_vitb16_lvd
  num_classes: 11
  norm: imagenet

regime: lora

lora:
  r: 8
  alpha: 16.0
  target_modules: [q, v]
  n_full_ft_blocks: 0       # 0 = LoRA partout, aucun bloc full FT
  dropout: 0.0

optim:
  weight_decay: 0.05
  lr:
    lora: 1.0e-4
    full_late: 5.0e-5   # ajouté — groupe vide (n_full_ft_blocks=0), jamais utilisé
    norm: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 0        # pas de LP-FT (comme MIDOG)
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
