# ViT-B/16 ImageNet — MHSA-only (attention + head dégelés, FFN gelé ; Touvron 2022).
# Régime screening 2/4. Recette T1 : warmup 3 ep · bf16 · grad_clip 1.0 · early-stop
# f1_macro_pres. Pas de LP-FT (head_only=0) : MHSA est déjà un fine-tuning partiel.
# 11 classes (RHOL exclu). LR SoTA : attn=1e-5, head=1e-4 (≠ notebook 4e-5/2e-4).
# NB : warmup_epochs sous `schedule:` (lu par engine.build_scheduler).
#
# NB CRITIQUE : num_classes=11 exige des CSV DÉJÀ remappés (RHOL exclue, labels 0-10) —
# splits/*.csv contient les labels bruts 0-11 (12cls) et train.py ne remappe PAS les
# labels au chargement (bug confirmé, cf. docs/audit_labels_screening.md). On pointe donc
# csv_dir vers splits_11cls/ (généré par scripts/generate_splits_11cls.py), qui contient
# déjà train.csv/val.csv/test.csv filtrés+remappés. Sur Narval/Colab, générer
# splits_11cls/ AVANT de lancer ce run (le script tourne en local pour l'instant).
paths_local:
  csv_dir: splits_11cls
paths_narval:
  csv_dir: ${SCRATCH}/splits_11cls
paths_colab:
  csv_dir: /content/drive/MyDrive/Memoire/splits_11cls

model:
  name: vitb16
  num_classes: 11
  norm: imagenet

regime: mhsa

optim:
  weight_decay: 0.05
  lr:
    attn: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 0
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
