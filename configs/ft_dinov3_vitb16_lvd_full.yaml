# DINOv3 ViT-B/16 (LVD-1689M) — FULL fine-tuning. Même recette que vitb16_fulft_sota.yaml
# (screening Full ImageNet) : warmup 3 ep · bf16 (sans GradScaler) · grad_clip 1.0 ·
# early-stop f1_macro_pres · LP-FT (head_only 2 ep). 11 classes (RHOL exclu), labels 0-10.
# Seul le backbone change — objectif : mesurer si le FT complet d'un SSL déjà fort (LVD)
# apporte un gain mesurable par rapport au frozen, à régime/hyperparamètres identiques.
#
# Backbone : HuggingFace facebook/dinov3-vitb16-pretrain-lvd1689m (AutoModel), dim 768,
# norm imagenet — MÊME loader que l'extraction frozen (configs/frozen_dinov3_lvd.yaml),
# réutilisé tel quel via src.models.build_frozen_extractor (cf. src.models.SSL_FT_NAMES).
# Aucun `checkpoint:` requis (poids HF, pas de .pth local).
#
# NB CRITIQUE csv_dir : PAS d'override ici (contrairement à vitb16_fulft_sota.yaml/
# vitb16_mhsa_sota.yaml) — ce config est lancé via scripts/datacurve_one_run.py, qui fait
# SON PROPRE filtrage RHOL + remap 12->11cls en interne sur les CSV BRUTS 12cls (splits/,
# défaut base.yaml). Pointer csv_dir vers un schéma déjà remappé (splits_11cls/) causerait
# un double-remap silencieux — bug identique à celui corrigé sur vitb16_mhsa_cui.yaml
# (commit 25cd274) mais jamais corrigé sur vitb16_fulft_sota.yaml/vitb16_mhsa_sota.yaml
# (config drift non déclenché à ce jour — cf. échange agent 2026-07-18, ne pas reproduire ici).
#
# C_grid : grille canonique 6 valeurs, identique à TOUS les configs FT/frozen existants
# (AGENTS.md §4.3 : comparaison FT vs frozen valide seulement à grille C identique).

model:
  name: dinov3_vitb16_lvd
  num_classes: 11
  norm: imagenet

regime: full

optim:
  weight_decay: 0.05
  lr:
    backbone: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 2
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
