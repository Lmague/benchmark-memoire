# ViT-B/16 DINOv3 (générique, lvd1689m) — ExPLoRA-like SUPERVISÉ (variante inspirée de
# Khanna 2024, arXiv:2406.10973 ; le papier original est du SSL non-supervisé).
#
# Architecture (cf. src.models._explora_groups) :
#   - blocs 0 et 11 (premier + dernier) : full fine-tuning (groupe 'full_late'),
#     conforme au papier ExPLoRA U={1,L}
#   - blocs 1..10 : q_proj/v_proj wrappés LoRA (k_proj intact) ; reste du bloc GELÉ
#     (init DINOv3 lvd1689m)
#   - toutes les LayerNorm (partout + norm finale) : dégelées (groupe 'norm')
#   - head : dégelée. pos_embed / cls_token / patch_embed : GELÉS.
# Le delta LoRA est fusionné à l'extraction (merge_lora_state_dict), qui gère
# maintenant LoRALinear (q_proj/v_proj séparés HF) en plus de LoRAFusedQKV (timm).
#
# Fidélité papier : LoRA Q,V uniquement (✓), blocs {1,L} (✓, corrige la variante
# précédente {10,11} qui ne couvrait pas le bloc bas-niveau). r=16/alpha=16
# (scaling=1.0), même capacité que la variante ImageNet pour comparaison directe.
#
# NB CRITIQUE csv_dir : PAS d'override ici (voir note identique dans
# ft_dinov3_vitb16_lvd_mhsa.yaml / ft_dinov3_vitb16_lvd_full.yaml). Le CSV attendu par
# _extract_backbone_embeddings + _apply_11cls_remap est le schema BRUT 12cls
# (defaut base.yaml : splits/) -- _apply_11cls_remap filtre RHOL et decale les indices
# lui-meme. Pointer csv_dir vers un schema deja remappe (splits_11cls/) cause un
# double-remap : le label 7 deja-11cls (RUBC, pas RHOL) est filtre par erreur, et la
# derniere classe (WILL, indice 10 en 11cls) disparait par decalage en cascade.
# CORRIGE le 20/07/2026 -- bug detecte sur dinov3_vitb16_lvd_explora (3 seeds, WILL
# absente des 3 splits, F1 canonique 0,5257 invalide, a recalculer apres reextraction).
# num_classes=11 (ci-dessous) concerne UNIQUEMENT la tete de classification entrainee,
# pas le format du CSV source -- aucun lien avec csv_dir.

model:
  name: dinov3_vitb16_lvd
  num_classes: 11
  norm: imagenet

regime: explora_like

lora:
  r: 16
  alpha: 16.0
  target_modules: [q, v]
  full_ft_block_indices: [0, 11]   # premier + dernier bloc (papier : U={1,L})
  dropout: 0.0

optim:
  weight_decay: 0.05
  lr:
    lora: 1.0e-4
    full_late: 5.0e-5
    norm: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 0
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
