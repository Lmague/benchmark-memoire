# Self-distillation contexte→tuile (Design A) — student DINOv3 ViT-B/16 LVD + LoRA.
# Teacher (DINOv3 ViT-L/16 LVD, gelé) et --context-size/--context-dir sont des flags
# CLI de scripts/context_distill.py, PAS des clés de cette config (cf. README).
#
# Point de départ LoRA : r=2 (blocs 6-11), motivé par les ablations DÉJÀ FAITES
# (results/lora_rank_ablation_CANONICAL.json : r=2 → F1=0.4838±0.0020 ; r=8 → 0.4829±0.0038 ;
# results/lora_block_ablation_CANONICAL.json : blocs 6-11 → F1=0.4844±0.0011, meilleur que
# blocs 0-5 → 0.4790±0.0019). ⚠️ Ces deux écarts (r2 vs r8 : +0.0009 ; blocs6-11 vs r8-tous-
# blocs-publié 0.4835 : +0.0009) sont TOUS DEUX < l'écart-type inter-seed ≈0.008 (AGENTS.md
# §4.4) — un point de départ défendable, PAS un optimum démontré. À reconfirmer avec le
# split spatial (ces ablations utilisaient le split aléatoire).
# Convention alpha=2r (dinov3_vitb16_lvd_lora_r8.yaml).

model:
  name: dinov3_vitb16_lvd
  num_classes: 11
  norm: imagenet

regime: lora

lora:
  r: 2
  alpha: 4.0
  target_modules: [q, v]
  n_full_ft_blocks: 0
  lora_block_indices: [6, 7, 8, 9, 10, 11]
  dropout: 0.0

data:
  batch_size: 64      # marge mémoire : student LoRA + teacher gelé (forward seul, pas
                       # d'état optimizer) partagent le même slice MIG a100_3g.20gb (cf.
                       # slurm_context_distill.sh). Réduire si OOM, quelle que soit la
                       # taille de contexte demandée (context_crop.py sauve toujours à
                       # out-size=224, donc sans effet direct sur ce budget mémoire).
  num_workers: 8
  image_size: 224

optim:
  weight_decay: 0.05
  lr:
    lora: 1.0e-4
    full_late: 5.0e-5   # groupe vide (n_full_ft_blocks=0), jamais utilisé
    norm: 1.0e-5
    head: 1.0e-4
    proj: 1.0e-4         # tête de projection 768(+scale)->1024 + MLP d'échelle

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 0
  amp_dtype: bfloat16   # requis par context_distill.py (pas de GradScaler implémenté)
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres   # cf. train.early_stop_metric ; balanced_accuracy
                                     # calculée et journalisée à chaque epoch mais pas
                                     # utilisée pour la sélection (garde la convention du
                                     # dépôt) — voir scripts/context_distill_README.md.

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
  max_iter: 2000
