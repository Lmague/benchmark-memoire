# SimDINOv2 ViT-B/16 (iNat21 Plantae, repo ilyassmoummad/sslplant) — MHSA-only (attention +
# head dégelés, FFN gelé ; Touvron 2022). Même recette que vitb16_mhsa_sota.yaml : warmup
# 3 ep · bf16 · grad_clip 1.0 · early-stop f1_macro_pres. Pas de LP-FT (head_only=0) : MHSA
# est déjà un fine-tuning partiel. 11 classes (RHOL exclu), labels 0-10. Seul le backbone
# change vs vitb16_mhsa_sota.yaml.
#
# Backbone : CLS (x_norm_clstoken), dim 768, norm simdino_inat — MÊME loader que
# l'extraction frozen (configs/frozen_simdinov2_vitb16.yaml), réutilisé tel quel via
# src.models.build_frozen_extractor (cf. src.models.SSL_FT_NAMES). `checkpoint:` = poids
# TEACHER pré-entraînés (obligatoires), chemin résolu relatif à paths.ckpt_dir. Doit déjà
# être présent sur Narval (même fichier que l'extraction frozen existante).
checkpoint: "simdinov2_vitb_inat21plantae.pth"

# Groupe 'attn' : le vendor sslplant (DINOv2-with-registers) nomme ses sous-modules
# d'attention "blocks.N.attn.*" — même convention que timm, couvert par
# src.models._is_attn_param sans logique additionnelle.
#
# NB CRITIQUE csv_dir : PAS d'override ici — voir note identique dans
# ft_simdinov2_vitb16_full.yaml (double-remap si csv_dir pointe vers un schéma déjà
# remappé ; ce config est consommé par scripts/datacurve_one_run.py, pas train.py
# directement).
#
# C_grid : grille canonique 6 valeurs, identique à TOUS les configs FT/frozen existants.

model:
  name: simdinov2_vitb16
  num_classes: 11
  norm: simdino_inat

regime: mhsa

optim:
  weight_decay: 0.05
  lr:
    attn: 1.0e-5
    head: 1.0e-4

schedule:
  warmup_epochs: 3

train:
  epochs: 50
  patience: 10
  head_only_epochs: 0
  amp_dtype: bfloat16
  grad_clip: 1.0
  early_stop_metric: f1_macro_pres

probe:
  C_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]
